<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Projection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface2:#f5f7f6; --ink:#17201d; --muted:#5f6b67; --line:#d9dfdc;
  --in:#1c7c5c; --out:#b23a48; --cash:#1f3f73; --proj:#b7861b; --projbg:#fbf5e6; --mixbg:#f6f2e9;
  --ok:#1c7c5c; --bad:#b23a48; --accent:#1f3f73; --hl:#fff4c2; --sk:#e7f0fb;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --surface:#1a1f1e; --surface2:#202624; --ink:#e6ebe9; --muted:#97a39f; --line:#2d3532;
    --in:#4dbb8f; --out:#e57582; --cash:#8db0ea; --proj:#e2b552; --projbg:#2a2618; --mixbg:#24231c;
    --ok:#4dbb8f; --bad:#e57582; --accent:#8db0ea; --hl:#3b3416; --sk:#1b2a3c; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a1f1e; --surface2:#202624; --ink:#e6ebe9; --muted:#97a39f; --line:#2d3532;
  --in:#4dbb8f; --out:#e57582; --cash:#8db0ea; --proj:#e2b552; --projbg:#2a2618; --mixbg:#24231c;
  --ok:#4dbb8f; --bad:#e57582; --accent:#8db0ea; --hl:#3b3416; --sk:#1b2a3c; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:14px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{padding:20px 24px 40px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.controls label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:120px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sample{background:var(--projbg);border:1px solid var(--proj);color:var(--ink);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.kpi{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.kpi td{padding:10px 14px;border-right:1px solid var(--line);vertical-align:top;width:16.66%}
.kpi td:last-child{border-right:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:600;margin-top:2px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.neg{color:var(--bad)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0}
.tabs button{font:inherit;font-weight:600;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 18px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin:4px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}
.tbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 8px}
.tbar h2{font-size:15px;margin:0;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;background:var(--surface);color:var(--muted);border:0;border-right:1px solid var(--line);padding:6px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.grid th,.grid td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.grid thead th{background:var(--surface);font-weight:500;color:var(--ink)}
.grid thead tr:first-child th{font-weight:600;text-align:center;border-bottom:0;padding-bottom:2px}
.grid thead tr:last-child th{border-bottom:3px solid var(--muted);text-align:center;color:var(--muted);font-size:12px}
.grid thead .tag{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.grid th.p .tag{color:var(--proj)}
.grid .lbl,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);min-width:190px}
.grid thead .lbl{z-index:3;border-bottom:3px solid var(--muted)}
.grid .sa{background:var(--surface2)}
.grid .sk{background:var(--sk)}
.grid .bp{background:var(--projbg)}
.grid .bm{background:var(--mixbg)}
.grid .gs{border-left:2px solid var(--line)}
.grid .tc{border-left:2px solid var(--muted);font-weight:600}
.grid thead th.grp.p{color:var(--proj)}
.grid tr.sec td{font-weight:600}
.grid tr.cp td:first-child{padding-left:26px;font-style:italic}
.grid tr.tot td{font-weight:600;border-top:1px solid var(--muted)}
.grid tr.kas td{font-weight:700}
.grid tr.blank td{border-bottom:0;height:12px;padding:0}
.val{margin-top:18px;font-size:13px}
.val h3{font-size:14px;margin:0 0 6px}
.val ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 20px}
.val li::before{content:"✓";color:var(--ok);font-weight:700;margin-right:8px}
.val li.fail::before{content:"✕";color:var(--bad)}
.note{color:var(--muted);font-size:12px;margin-top:10px}
@media (max-width:820px){.kpi td{display:block;width:auto;border-right:0;border-bottom:1px solid var(--line)}}

.grid tr.sec td:first-child{cursor:pointer;user-select:none}
.grid tr.sec td:first-child .car{display:inline-block;width:14px;color:var(--muted)}
.grid tr.sec td{font-weight:600}
.grid tr.grand td{font-weight:700;border-top:1px solid var(--muted)}
.grid tr.hide{display:none}
.flags{background:var(--projbg);border:1px solid var(--proj);border-radius:6px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.flags ul{margin:4px 0 0;padding-left:18px}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts button{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.opts label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.opts input[type=checkbox]{min-width:0}

.grid tr.hl td,.grid tr.hl td:first-child{background:var(--hl)}


.ro{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ro b{font-size:15px;font-weight:600;color:var(--ink);padding:6px 0;font-variant-numeric:tabular-nums}

.dpick{position:relative;display:inline-block}
.dpick .dtext{width:150px;min-width:0;padding-right:30px;cursor:pointer;background:var(--surface) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%235f6b67%27 stroke-width=%272%27%3E%3Crect x=%273%27 y=%275%27 width=%2718%27 height=%2716%27 rx=%272%27/%3E%3Cpath d=%27M3 10h18M8 3v4M16 3v4%27/%3E%3C/svg%3E") no-repeat right 8px center}
.dpick .dnat{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;min-width:0;padding:0;border:0}
.dpick:focus-within .dtext{outline:2px solid var(--accent);outline-offset:1px}
html{background:var(--bg)}
body{background:transparent;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27420%27 height=%27640%27 viewBox=%270 0 420 640%27%3E%3Cg fill=%27none%27 stroke=%27%236f7f79%27 stroke-opacity=%27.28%27%3E%3Cpath d=%27M20 640V270Q20 120 210 20Q400 120 400 270V640%27 stroke-width=%272%27/%3E%3Cpath d=%27M50 640V280Q50 150 210 60Q370 150 370 280V640%27/%3E%3Cpath d=%27M80 640V290Q80 175 210 100Q340 175 340 290V640%27/%3E%3Cpath d=%27M110 640V300Q110 200 210 140Q310 200 310 300V640%27 stroke-dasharray=%273 5%27/%3E%3Cg transform=%27translate%28210 230%29%27%3E%3Crect x=%27-26%27 y=%27-26%27 width=%2752%27 height=%2752%27/%3E%3Crect x=%27-26%27 y=%27-26%27 width=%2752%27 height=%2752%27 transform=%27rotate%2845%29%27/%3E%3Ccircle r=%2714%27/%3E%3Ccircle r=%2740%27/%3E%3C/g%3E%3Cpath d=%27M20 400H400M20 410H400%27 stroke-opacity=%27.5%27/%3E%3C/g%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27420%27 height=%27640%27 viewBox=%270 0 420 640%27%3E%3Cg fill=%27none%27 stroke=%27%236f7f79%27 stroke-opacity=%27.28%27%3E%3Cpath d=%27M20 640V270Q20 120 210 20Q400 120 400 270V640%27 stroke-width=%272%27/%3E%3Cpath d=%27M50 640V280Q50 150 210 60Q370 150 370 280V640%27/%3E%3Cpath d=%27M80 640V290Q80 175 210 100Q340 175 340 290V640%27/%3E%3Cpath d=%27M110 640V300Q110 200 210 140Q310 200 310 300V640%27 stroke-dasharray=%273 5%27/%3E%3Cg transform=%27translate%28210 230%29%27%3E%3Crect x=%27-26%27 y=%27-26%27 width=%2752%27 height=%2752%27/%3E%3Crect x=%27-26%27 y=%27-26%27 width=%2752%27 height=%2752%27 transform=%27rotate%2845%29%27/%3E%3Ccircle r=%2714%27/%3E%3Ccircle r=%2740%27/%3E%3C/g%3E%3Cpath d=%27M20 400H400M20 410H400%27 stroke-opacity=%27.5%27/%3E%3C/g%3E%3C/svg%3E"),url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2796%27 height=%2796%27 viewBox=%270 0 96 96%27%3E%3Cg fill=%27none%27 stroke=%27%236f7f79%27 stroke-opacity=%27.14%27 stroke-width=%271%27%3E%3Crect x=%2728%27 y=%2728%27 width=%2740%27 height=%2740%27/%3E%3Crect x=%2728%27 y=%2728%27 width=%2740%27 height=%2740%27 transform=%27rotate%2845 48 48%29%27/%3E%3Ccircle cx=%2748%27 cy=%2748%27 r=%279%27/%3E%3Cpath d=%27M0 0L20 20M96 0L76 20M0 96L20 76M96 96L76 76%27/%3E%3Cpath d=%27M48 0v8M48 96v-8M0 48h8M96 48h-8%27/%3E%3C/g%3E%3C/svg%3E"),linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 60%);
  background-repeat:no-repeat,no-repeat,repeat,no-repeat;
  background-position:right -90px top 30px,left -170px bottom -140px,0 0,0 0;
  background-size:560px auto,460px auto,96px 96px,100% 100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{filter:invert(1);opacity:.35}}
:root[data-theme="dark"] body::before{filter:invert(1);opacity:.35}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Cash Projection <span id="entName"></span></h1>
      <div class="sub" id="subline"></div>
    </div>
    <div class="controls">
      <label>Entitas<select id="entSel"></select></label>
      <label>Dari tanggal<span class="dpick"><input type="text" class="dtext" id="fromD_t" readonly><input type="date" id="fromD" class="dnat"></span></label>
      <label>Sampai tanggal<span class="dpick"><input type="text" class="dtext" id="toD_t" readonly><input type="date" id="toD" class="dnat"></span></label>
      <label>Cut-off realisasi<span class="dpick"><input type="text" class="dtext" id="cutoff_t" readonly><input type="date" id="cutoff" class="dnat"></span></label>
      <div class="ro"><span>Saldo kas awal (Rp)</span><b id="kasAwal"></b></div>
      <div class="ro"><span>Saldo kas minimum (Rp)</span><b id="minKas"></b></div>
    </div>
  </header>


  <table class="kpi"><tr id="kpiRow"></tr></table>

  <div class="tabs" role="tablist">
    <button role="tab" data-g="d" aria-selected="true">Harian</button>
    <button role="tab" data-g="w" aria-selected="false">Mingguan</button>
    <button role="tab" data-g="m" aria-selected="false">Bulanan</button>
  </div>
  <div class="panel">
    <div class="legend"><span><i style="background:var(--surface2);border:1px solid var(--line)"></i>Saldo Awal</span><span><i style="background:var(--sk);border:1px solid var(--line)"></i>Saldo Akhir</span><span><i style="background:var(--projbg);border:1px solid var(--proj)"></i>Proyeksi (budget, belum ada realisasi)</span><span><i style="background:var(--mixbg);border:1px solid var(--line)"></i>Periode campuran aktual + proyeksi</span></div>
    <div class="tbar">
      <h2 id="tblTitle"></h2>
      <div class="opts">
        <label id="activeOnlyWrap"><input type="checkbox" id="activeOnly" checked>Hanya hari bertransaksi</label>
        <button id="expandAll">Buka semua</button>
        <button id="collapseAll">Tutup semua</button>
      </div>
    </div>
    <div class="tscroll"><table class="grid" id="grid"></table></div>
  </div>
</div>

function compute(){
  const to=S.to>E.end?E.end:S.to, from=S.from<E.start?E.start:S.from, cut=E.cutoff;
  const all=dayList(E.start,to), off=Math.max(0,all.indexOf(from)), days=all.slice(off);
  const nextDay=iso(addDays(parse(cut),1));
  const carryAll=all.map(()=>0);
  let arr={budget:0,real:0,total:0,dates:new Set()};
  const secs=E.sections.map((sec,si)=>{
    const acc=sec.cat==='AR';
    const items=sec.items.map(it=>{
      let arrears=0,colDate=null;
      if(acc){let bb=0,rr=0;for(const[d,v]of Object.entries(it.b))if(d>=from&&d<=cut)bb+=v;for(const[d,v]of Object.entries(it.r))if(d>=from&&d<=cut)rr+=v;
        arr.budget+=bb;arr.real+=rr;arrears=Math.max(0,bb-rr);
        if(S.carry&&S.basis==='cash'&&arrears>0){colDate=Object.keys(it.b).filter(d=>d>cut&&it.b[d]>0).sort()[0]||nextDay;if(colDate<=E.end){arr.total+=arrears;arr.dates.add(colDate);}else colDate=null;}}
      let bal=it.saldoAwal||0;
      const rows=all.map((ds,i)=>{const b=it.b[ds]||0,act=ds<=cut,r=act?(it.r[ds]||0):null,extra=colDate===ds?arrears:0;
        if(extra)carryAll[i]+=extra;
        const flow=act?r:b+extra;let awal=null,akhir=null;
        if(i===off)bal=0;awal=bal;bal=awal+b-(r||0);akhir=bal;
        return{b,r,flow,awal,akhir};}).slice(off);
      const lowR=Math.min(0,...rows.map(x=>x.akhir)),open=-lowR;
      if(open>0)rows.forEach(x=>{x.awal+=open;x.akhir+=open;});
      return{name:it.name,open,rows,active:rows.some(x=>x.b||x.r||x.flow||Math.abs(x.awal)>=5e4),hasSaldo:true};
    }).filter(x=>x.active);
    if(acc&&S.carry&&S.basis==='cash'){const cr=carryAll.slice(off);if(cr.some(v=>v))items.push({name:'Akumulasi AR (tunggakan s.d. cut-off)',synthetic:true,hasSaldo:false,
      rows:cr.map(v=>({b:v,r:null,flow:0,awal:null,akhir:null}))});}
    return{key:sec.cat+'|'+sec.title,title:sec.title,cat:sec.cat,sign:sec.sign,items};
  }).filter(s=>s.items.length);
  let p0=0;secs.forEach(s=>s.items.forEach(it=>{if(!it.synthetic&&it.open)p0+=s.sign*it.open;}));
  let kr=0,pr=p0;
  const cash=days.map((ds,i)=>{let bin=0,bout=0,rin=0,rout=0;
    secs.forEach(s=>s.items.forEach(it=>{if(it.synthetic)return;const x=it.rows[i];

    const act=ds<=cut,nb=bin-bout,nr=act?rin-rout:0,kAwal=kr,pAwal=pr;kr=kAwal+nr;pr=pAwal+nb-nr;

  let low0=Infinity,lowDs=null,lowK=0;cash.forEach(c=>{if(c.akhir<low0){low0=c.akhir;lowDs=c.ds;}if(c.kAkhir<lowK)lowK=c.kAkhir;});
  const totOut=cash.reduce((s,c)=>s+c.cout,0),avgWk=Math.round(totOut/(days.length/7));
  const minKas=S.autoMin?avgWk:E.minKas;
  const req=Math.max(0,Math.ceil(minKas-low0),Math.ceil(-lowK));
  const kasAwal=S.autoKas?req:E.saldoKasAwal;
  cash.forEach(c=>{c.awal+=kasAwal;c.akhir+=kasAwal;c.kAwal+=kasAwal;c.kAkhir+=kasAwal;});
  return{days,secs,cash,from,to,arr,kasAwal,req,lowDs,minKas,avgWk};
}

function periods(g,activeOnly){

    const k=g==='d'?ds:g==='m'?ds.slice(0,7):weekStart(ds);if(!map.has(k))map.set(k,[]);map.get(k).push(i);});
  return[...map].map(([key,idx])=>{
    const f=C.days[idx[0]],l=C.days[idx[idx.length-1]],na=idx.filter(i=>C.cash[i].act).length;
    const st=na===idx.length?'A':na===0?'P':'A/P';
    let label;

  const totOf=a=>({awal:a[0].awal,budget:a.reduce((s,x)=>s+x.budget,0),real:sumN(a.map(x=>x.real)),akhir:a[a.length-1].akhir});
  const four=(x,p,tot,sg=1)=>[x.awal,x.budget,x.real,x.akhir].map((v,k)=>`<td class="${cc(p,k,tot)}">${jt(v===null||v===undefined?v:sg*v)}</td>`).join('');
  const row=(label,arr,rc,attr='',sg=1)=>`<tr class="${rc}" ${attr}><td>${label}</td>${arr.map((x,i)=>four(x,P[i],false,sg)).join('')}${four(totOf(arr),null,true,sg)}</tr>`;
  const head='<thead><tr><th rowspan="2" class="lbl"></th>'+P.map(p=>`<th colspan="4" class="grp gs ${p.st==='P'?'p':''}">${p.label}<span class="tag">${tag(p)}</span></th>`).join('')+
    '<th colspan="4" class="grp tc">Total periode<span class="tag">&nbsp;</span></th></tr><tr>'+
    P.map(p=>SUB.map((t,k)=>`<th class="${cc(p,k,false)}">${t}</th>`).join('')).join('')+SUB.map((t,k)=>`<th class="${cc(null,k,true)}">${t}</th>`).join('')+'</tr></thead>';
  const blank=`<tr class="blank"><td colspan="${W}"></td></tr>`;
  const label=t=>`<tr class="sec"><td colspan="${W}" style="cursor:default">${t}</td></tr>`;
  const add=(arrs)=>P.map((_,i)=>({awal:sumN(arrs.map(a=>a[i].awal)),budget:arrs.reduce((s,a)=>s+a[i].budget,0),real:sumN(arrs.map(a=>a[i].real)),akhir:sumN(arrs.map(a=>a[i].akhir))}));
  const secBlock=s=>{const ag=s.items.map(it=>aggItem(it,P)),sub=add(ag),col=S.collapsed.has(s.key);
    const html=row(`<span class="car">${col?'▸':'▾'}</span>${s.title} <span style="color:var(--muted);font-weight:400">(${s.items.filter(i=>!i.synthetic).length})</span>`,sub,'sec',`data-key="${s.key}"`,s.sign)+
      s.items.map((it,j)=>row(it.synthetic?`<span style="font-style:normal">${it.name}</span>`:it.name,ag[j],'cp'+(col?' hide':''),'',s.sign)).join('');
    return{html,sub};};
  let body='';const cat={AR:[],AP:[],OPS:[]};
  const ar=C.secs.filter(s=>s.cat==='AR').map(secBlock);ar.forEach(b=>{body+=b.html;cat.AR.push(b.sub);});
  if(cat.AR.length)body+=row('Total Account Receivables',add(cat.AR),'tot hl');
  [['AP','Account Payables'],['OPS','Operasional']].forEach(([k,name])=>{
    const bl=C.secs.filter(s=>s.cat===k).map(secBlock);if(!bl.length)return;
    body+=blank+label(name)+bl.map(b=>b.html).join('');bl.forEach(b=>cat[k].push(b.sub));
    body+=row('Total '+name,add(cat[k]),'tot hl','',-1);});
  const z=P.map(()=>({awal:null,budget:0,real:null,akhir:null}));
  const inS=cat.AR.length?add(cat.AR):z,outS=add([...cat.AP,...cat.OPS].length?[...cat.AP,...cat.OPS]:[z]);
  body+=blank+row('Total Cash Out',outS,'grand hl','',-1);
  const pk=f=>P.map(p=>{const cs=p.idx.map(i=>C.cash[i]);return f(cs);});
  const L=cs=>cs[cs.length-1],nb=cs=>cs.reduce((s,c)=>s+c.kb,0),nr=cs=>sumN(cs.map(c=>c.kr));
  body+=blank+row('Kas Realisasi',pk(cs=>({awal:cs[0].kAwal,budget:null,real:nr(cs),akhir:L(cs).kAkhir})),'kas');
  body+=row('Projection',pk(cs=>({awal:cs[0].pAwal,budget:nb(cs),real:nr(cs),akhir:L(cs).pAkhir})),'kas');
  body+=row('Kas + Projection',pk(cs=>({awal:cs[0].awal,budget:nb(cs),real:null,akhir:L(cs).akhir})),'grand kas');
  const g=document.getElementById('grid');g.innerHTML=head+'<tbody>'+body+'</tbody>';
  g.querySelectorAll('tr.sec[data-key]').forEach(tr=>tr.firstElementChild.onclick=()=>{const k=tr.dataset.key;S.collapsed.has(k)?S.collapsed.delete(k):S.collapsed.add(k);renderTable();});
  document.getElementById('tblTitle').textContent={d:'Rincian harian',w:'Rincian mingguan (Sabtu–Jumat, dipotong akhir bulan)',m:'Rincian bulanan'}[S.g];
  document.getElementById('activeOnlyWrap').style.display=S.g==='d'?'':'none';
  const nk=E.nok||{AP:[],OPS:[]};
  if(document.getElementById('note'))document.getElementById('note').innerHTML=(S.basis==='ar'
    ?'Kas = Saldo kas awal + AR − AP − Ops. AR diakui sebesar budget; AP dan Ops memakai realisasi sampai cut-off, budget setelahnya. Angka Account Payables, Operasional, dan Total Cash Out ditampilkan negatif (arus keluar). Baris Projection: Budget dan Realisasi = AR + Cash Out (negatif) sesuai data masing-masing; Saldo Akhir kas memakai AR budget, jadi bisa berbeda dari Saldo Awal + Realisasi selama AR belum tertagih. Saldo per baris AR/AP/Ops: Saldo Akhir = Saldo Awal + Budget − Realisasi (Saldo Awal periode = kebutuhan minimum supaya Saldo Akhir tidak minus; kalau tidak pernah minus, mulai dari 0) = budget yang belum terealisasi; angka minus berarti realisasi melebihi budget.'
    :'Realisasi dipakai sampai tanggal cut-off, Budget setelahnya. Saldo per baris AR/AP/Ops: Saldo Akhir = Saldo Awal + Budget − Realisasi, Saldo Awal periode = kebutuhan minimum supaya Saldo Akhir tidak minus; tunggakan AR s.d. cut-off ditagih pada jadwal tagih berikutnya (baris Akumulasi AR). Kas = saldo kas awal + cash in − cash out.')+' Rupiah.'+
    (nk.AP.length?`<br>Rincian tanpa Kelompok di file, dipetakan ke Account Payables: ${nk.AP.join(', ')}; ke Operasional: ${nk.OPS.join(', ')}.`:'');
}

/* ---------- validasi ---------- */
function renderValidation(){
  const res=[],tol=1;
  const tots=['d','w','m'].map(g=>{const P=periods(g,false);let cin=0,cout=0;P.forEach(p=>p.idx.forEach(i=>{cin+=C.cash[i].cin;cout+=C.cash[i].cout;}));return{cin,cout};});
  res.push([Math.abs(tots[0].cin-tots[1].cin)<tol&&Math.abs(tots[0].cin-tots[2].cin)<tol&&Math.abs(tots[0].cout-tots[1].cout)<tol&&Math.abs(tots[0].cout-tots[2].cout)<tol,'Total cash in & cash out harian = mingguan = bulanan (termasuk akumulasi AR)']);
  // cocokkan dengan total mentah CSV per bulan
  const ms=months(S.from.slice(0,7),S.to.slice(0,7));let bad=[];
  ms.forEach(m=>{const s=E.src[m]||{inB:0,inR:0,outB:0,outR:0};let inB=0,inR=0,outB=0,outR=0;
    E.sections.forEach(sec=>sec.items.forEach(it=>{for(const[d,v]of Object.entries(it.b))if(d.startsWith(m)){sec.sign>0?inB+=v:outB+=v;}
      for(const[d,v]of Object.entries(it.r))if(d.startsWith(m)){sec.sign>0?inR+=v:outR+=v;}}));
    if(Math.abs(inB-s.inB)>tol||Math.abs(inR-s.inR)>tol||Math.abs(outB-s.outB)>tol||Math.abs(outR-s.outR)>tol)bad.push(mLabel(m));});
  res.push([!bad.length,bad.length?'Tidak cocok dengan total CSV: '+bad.join(', '):'Budget & realisasi per bulan cocok dengan total mentah CSV ('+ms.map(mLabel).join(', ')+')']);
  {const a=C.arr;res.push([true,`Akumulasi AR s.d. cut-off = budget ${jtK(a.budget)} − realisasi ${jtK(a.real)} = ${jtK(a.budget-a.real)}`+(S.basis==='cash'&&S.carry?`; yang dimasukkan ke proyeksi ${jtK(a.total)}`:'')]);}
  {let bad=0;C.secs.forEach(s=>s.items.forEach(it=>{if(it.synthetic)return;const rs=it.rows;const d=rs[rs.length-1].akhir-rs[0].awal-rs.reduce((a,x)=>a+x.b-(x.r||0),0);if(Math.abs(d)>1)bad++;}));
   res.push([!bad,bad?bad+' baris tidak memenuhi Saldo Awal + Budget − Realisasi = Saldo Akhir':'Semua baris AR/AP/Ops: Saldo Awal + Budget − Realisasi = Saldo Akhir']);}
  {const lo=Math.min(...C.cash.map(c=>c.akhir));res.push([lo>=C.minKas-1,lo>=C.minKas-1?`Saldo Akhir Projection tidak pernah minus (terendah ${jtK(lo)})`:`Saldo Akhir Projection minus, terendah ${jtK(lo)}`]);}
  {const neg=[],op=[];C.secs.forEach(s=>s.items.forEach(it=>{if(it.synthetic)return;if(it.rows.some(x=>x.akhir<-1))neg.push(it.name);if(it.open>0)op.push(`${it.name} ${jtK(it.open)}`);}));
   res.push([!neg.length,neg.length?'Saldo Akhir minus: '+neg.join(', '):'Tidak ada Saldo Akhir AR/AP/Ops yang minus']);
   if(op.length)res.push([true,'Saldo Awal yang ditambahkan supaya tidak minus (Rp): '+op.join('; ')]);}
  const st=E.stats;res.push([true,`Baris terbaca: cash out ${st.outRows}, cash in ${st.inRows}; ${st.droppedEmpty} baris tanpa rincian & tanpa nilai diabaikan`]);
  if(E.merges.length)res.push([true,'Nama digabung (beda huruf/tanda baca): '+E.merges.map(m=>m.join(' = ')).join('; ')]);
  const late=[];E.sections.forEach(sec=>sec.items.forEach(it=>{for(const d of Object.keys(it.r))if(d>E.cutoff&&d>=C.from&&d<=C.to)late.push(it.name);}));
  res.push([!late.length,late.length?'Ada realisasi setelah cut-off yang tidak terpakai: '+[...new Set(late)].slice(0,5).join(', '):'Tidak ada realisasi bertanggal setelah cut-off']);
  document.getElementById('valList').innerHTML=res.map(([ok,t])=>`<li class="${ok?'':'fail'}">${t}</li>`).join('');
}

const ddmm=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
function syncDates(){for(const id of['fromD','toD','cutoff'])$(id+'_t').value=ddmm($(id).value);}
function renderAll(){syncDates();C=compute();$('kasAwal').textContent=nf0.format(C.kasAwal);$('minKas').textContent=nf0.format(C.minKas);renderHeader();renderTable();}

/* ---------- kontrol ---------- */
const $=id=>document.getElementById(id);
$('entSel').innerHTML=Object.keys(DATA).map(k=>`<option value="${k}">${DATA[k].label||k}</option>`).join('');
function syncControls(){E=DATA[S.ent];S.collapsed=new Set(E.sections.map(s=>s.cat+'|'+s.title));S.from=E.defFrom+'-01';S.to=monthEnd(E.defTo)>E.end?E.end:monthEnd(E.defTo);
  for(const id of['fromD','toD','cutoff']){$(id).min=E.start;$(id).max=E.end;}
  $('fromD').value=S.from;$('toD').value=S.to;$('cutoff').value=E.cutoff;}
$('entSel').onchange=()=>{S.ent=$('entSel').value;syncControls();renderAll();};
$('fromD').onchange=()=>{if(!$('fromD').value)return;S.from=$('fromD').value;if(S.to<S.from){S.to=S.from;$('toD').value=S.to;}renderAll();};
$('toD').onchange=()=>{if(!$('toD').value)return;S.to=$('toD').value;if(S.to<S.from){S.from=S.to;$('fromD').value=S.from;}renderAll();};
$('cutoff').onchange=e=>{if(e.target.value){E.cutoff=e.target.value;renderAll();}};
$('activeOnly').onchange=e=>{S.activeOnly=e.target.checked;renderTable();};
$('expandAll').onclick=()=>{S.collapsed.clear();renderTable();};
$('collapseAll').onclick=()=>{E.sections.forEach(s=>S.collapsed.add(s.cat+'|'+s.title));renderTable();};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.g=b.dataset.g;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderTable();});

for(const id of['fromD','toD','cutoff']){const n=$(id);n.addEventListener('click',()=>{try{n.showPicker();}catch(e){}});n.addEventListener('input',syncDates);}
syncControls();renderAll();
</script>
